# D1 实机部署 — 单一配置源
# 使用者: single_run.launch.py, d1_planner_bridge.launch.py, start_ego_stack.sh
# launch 仅负责起节点与少量 runtime 覆盖（enable_tag_tracking、话题名等）

topics:
  odom: "/ov_msckf/odomimu"
  pose: "/ov_msckf/pose_stamped"
  depth: "/camera/camera/depth/image_rect_raw"
  pos_cmd: "/drone_0_planning/pos_cmd"
  cmd_vel: "/command/cmd_twist"
  map_frame_id: "global"

limits:
  max_vel: 0.6   # 规划 + traj_server 终点引导速度上限 (m/s)
  max_wz: 0.5    # traj_server yaw_dot + bridge 角速度上限 (rad/s)
  max_acc: 1.0   # 规划加速度上限 (m/s^2)

# odom 接收诊断（仅日志，不停车）。注入 fsm/ + traj_server/
# SUSPECT_JUMP: 时间戳间隔正常但隐含速度过高（更像 VIO 跳）
# LIKELY_LAG:   stamp 间隔大 / age 高 / 墙钟落后（更像本节点处理不及时）
odom_diag:
  enable: true
  period_ms: 500
  implausible_speed: 0.5       # 与手持/实机速度阈值同量级；隐含 v 超此值才告警
  stamp_dt_lag_sec: 0.15       # stamp 间隔 ≥ 此值时偏判 LIKELY_LAG
  stamp_age_warn_sec: 0.10     # now-stamp 过大 → 时效差

# D435i depth 640x360 — 设备上可用 ros2 topic echo .../depth/camera_info 核对
camera:
  cx: 323.168
  cy: 180.403
  fx: 320.244
  fy: 320.244

# 跨模块共享的规划尺度（注入 fsm / manager / grid_map / optimization）
planner:
  map_size_x: 40.0
  map_size_y: 40.0
  map_size_z: 3.0
  planning_horizon: 7.5
  goal_reach_thresh: 0.3
  tag_stop_dist: 0.25   # AprilTag 追踪：距检测点 XY 距离 ≤ 此值则停车 (m)
  thresh_replan_time: 2.5
  collision_check_step: 0.05   # FSM 轨迹安全：段间 raycast 空间步长 (m)
  obstacles_inflation: 0.12      # near-obs: slight XY pad (was 0.10)
  optimization_dist0: 0.55
  lambda_fitness: 1.5

fsm:
  thresh_no_replan_meter: 1.0
  planning_horizen_time: 3.0
  emergency_time: 1.0
  estop_imminent_time: 0.45      # near-obs: earlier estop when hit is close (was 0.3)
  estop_min_approach_speed: 0.05 # PR-2: below this XY speed, prefer REPLAN over estop when only in inflate
  safety_replan_trials: 5        # PR-2: escape attempts in safety callback before tier decision
  global_replan_drift_thresh: 0.25
  fail_safe: true
  log_trace_period_ms: 500
  # P0-1: local target 若在膨胀占据内，沿全局路径回退到最近 free 点
  local_target_free_search: true
  local_target_free_step: 0.1
  # P0-2: 轨迹前方撞障且 escape replan 失败 → 发布停车样条；连续失败再 EMERGENCY_STOP
  safety_slowdown_enable: true
  safety_fail_estop_count: 2     # near-obs: fail faster to estop (was 3)
  gen_new_traj_max_failures: 8
  gen_new_traj_backoff_base_sec: 0.25
  gen_new_traj_backoff_max_sec: 2.0
  # docs/08: 近障起步 — 发布前门禁 / 近障行为 / odom 异常刹停
  publish_collision_gate_enable: true
  publish_collision_gate_skip_start_m: 0.08
  near_obstacle_check_radius: 0.6
  near_obstacle_block_escape: true
  near_obstacle_stop_before_plan: true
  odom_anomaly_hold_enable: true
  odom_z_jump_thresh: 0.15
  odom_anomaly_implied_v: 1.5
  tag_pose_topic: "/apriltag/target_pose_global"
  tag_detected_topic: "/apriltag/target_detected"
  tag_update_min_dist: 0.08
  tag_replan_min_period: 0.5

grid_map:
  resolution: 0.1
  local_update_range_x: 12.0
  local_update_range_y: 8.0
  local_update_range_z: 4.5
  local_map_margin: 10
  ground_height: -0.5
  use_depth_filter: true
  depth_filter_tolerance: 0.15
  depth_filter_maxdist: 5.0
  depth_filter_mindist: 0.10   # B: 0.2 → 0.10，缩小近场盲区
  depth_filter_margin: 2
  k_depth_scaling_factor: 1000.0
  skip_pixel: 1                # B: 2 → 1，深度采样更密（算力紧时再退回 2）
  p_hit: 0.70                  # A: 0.65 → 0.70，障碍命中涨更快
  p_miss: 0.30                 # A: 0.35 → 0.30，清除更慢
  p_min: 0.12
  p_max: 0.90
  p_occ: 0.80
  min_ray_length: 0.1
  max_ray_length: 4.5
  virtual_ceil_height: 2.9
  visualization_truncate_height: 1.8
  show_occ_time: false
  pose_type: 1
  occ_confirm_frames: 2        # A: 3 → 2，更快确认有障碍
  occ_clear_frames: 10         # A: 5 → 10，更慢清除（须慢于 confirm）
  use_fixed_publish_window: true
  map_vis_rate: 10.0
  odom_depth_timeout: 2.5
  # 地面 vs 凸起：z_ground = camera_z - camera_to_ground；h < obstacle_min_height → free
  ground_filter_enable: true
  ground_filter_margin: 0.04   # 仅当 camera_to_ground<=0 时的旧逻辑备用
  camera_to_ground: 0.40       # 相机离地估计 (m)；过大易把矮障当地板滤掉
  obstacle_min_height: 0.10    # 离地低于此值当地板；脚边矮障约 0.10~0.20 会保留
  inflate_xy_only: true
  # 方案A：查询时对 (x,y) 做高度柱检查 [ground_height+z_eps, query_z]
  column_collision_enable: true
  column_collision_z_eps: 0.05
  # 机身 footprint（相机/odom 原点）：用于膨胀图清空与 getInflateOccupancy 豁免
  # 几何：相机在最前方往后 10cm；左右各 20cm。前方轴=body +Z（与 bridge 一致）
  robot_footprint_enable: true
  robot_footprint_front: 0.10   # 相机 → 鼻尖
  robot_footprint_back: 0.20    # 相机后方（未单独测量，暂与半宽同量级，可改）
  robot_footprint_left: 0.20
  robot_footprint_right: 0.20
  robot_footprint_radius: 0.0   # 旧圆形模型；>0 且 box 全 0 时才启用圆形
  # 机身不当膨胀种子、膨胀结果不写回；清洞=物理 box ⊕ clear_margin（消洞边假墙）
  robot_footprint_no_inflate: true
  robot_footprint_clear_margin: 0.12  # ≈ obstacles_inflation

manager:
  max_jerk: 4.0
  control_points_distance: 0.4
  feasibility_tolerance: 0.05
  use_robot_z_planning: true
  # Global geometric path: planar A* then min-snap
  global_astar_enable: true
  global_astar_step: 0.2          # search resolution (m); larger = faster, coarser
  global_astar_timeout: 0.5       # seconds
  global_astar_fallback_straight: true
  global_astar_simplify_eps: 0.25 # RDP simplify on XY (m)
  global_astar_insert_dist: 4.0   # densify for min-snap segments (m)
  # Scheme L: curvature fillets on A* polyline (non-holonomic soft constraint)
  # kappa_max ≈ max_wz / max_vel = 0.5/0.6
  hybrid_enable: true
  hybrid_max_curvature: 0.83
  hybrid_corner_angle_thresh: 0.5   # rad; sharper corners get filleted
  hybrid_arc_sample_step: 0.2
  hybrid_max_arc_points: 30
  hybrid_use_odom_start_yaw: true
  hybrid_blend_start_yaw: true
  hybrid_align_yaw_thresh: 0.4      # rad; align with bridge align_heading_thresh
  # docs/08: 起步圆弧占障则缩 R / 放弃 blend，避免大半径扫入近障
  hybrid_blend_occ_check: true
  hybrid_blend_r_shrink_tries: 2

optimization:
  lambda_smooth: 1.0
  lambda_collision: 0.5
  lambda_feasibility: 0.1

bspline:
  limit_ratio: 1.1

traj_server:
  time_forward: 0.7
  use_odom_progress: true
  odom_lookahead_time: 0.5
  log_trace_period_ms: 500
  tracking_trace_period_ms: 50   # CSV row interval
  endpoint_stop_dist: 0.3        # same as planner.goal_reach_thresh; vel=0 inside this radius
